<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的交通資訊板</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    
    
    <div class="container">
        <div class="left-panel">
            <div id="clock">00:00</div>
            <div id="date">0000年0月0日</div>  

           <div class="weather-container">
              <img id="weather-icon" src="" alt="天氣" style="width: 100px; height: 100px;">   
              <div id="weather">天氣載入中...</div>
              <div id="weather-warning" style="color: #ffcc00; font-weight: bold; margin-top: 10px;"></div>
            </div>
        </div>

            <div class="right-panel">
                <div id="bus-list"></div>
               

            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
